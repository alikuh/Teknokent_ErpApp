<!DOCTYPE html>
<html lang="tr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Giriş · Veresiye Defteri</title>
	<link rel="stylesheet" href="industry.css">
	<link rel="stylesheet" href="app.css">
	<script src="csrf.js"></script>
	<script src="config.js"></script>
	<style>
		body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
		.auth-card {
			position: relative; width: 360px;
			border: 1px solid var(--color-divider); background: var(--color-surface);
			padding: 36px 32px 28px;
		}
		.auth-kicker {
			font-family: var(--font-heading); font-size: 12px;
			letter-spacing: .14em; text-transform: uppercase; color: var(--color-accent-700);
		}
		.auth-card h1 { font-size: 27px; margin: 2px 0 4px; }
		.auth-card .lead { color: var(--color-neutral-700); margin: 0 0 22px; font-size: 14px; }
		.auth-card .field { margin-bottom: 14px; }
		.auth-card .btn { width: 100%; justify-content: center; margin-top: 6px; }
		.auth-msg { min-height: 18px; font-size: 13px; margin-top: 12px; color: var(--c-debt-deep); }
		.auth-msg.ok { color: var(--c-paid-deep); }
		.auth-switch {
			margin-top: 20px; padding-top: 16px; font-size: 13px;
			border-top: 1px solid var(--color-divider); color: var(--color-neutral-700);
		}
	</style>
</head>

<body>
	<div class="auth-card">
		<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
		<div class="auth-kicker">Veresiye Defteri</div>
		<h1>Giriş yap</h1>
		<p class="lead">Dükkânın hesabına devam et.</p>

		<div class="field">
			<label for="username">Kullanıcı adı</label>
			<input id="username" type="text" autocomplete="username">
		</div>
		<div class="field">
			<label for="password">Şifre</label>
			<input id="password" type="password" autocomplete="current-password">
		</div>

		<button id="loginBtn" class="btn primary">Giriş yap</button>
		<div id="msg" class="auth-msg"></div>

		<div class="auth-switch">Hesabın yok mu? <a href="register.html">Kayıt ol</a></div>
	</div>

	<script>
		var API_URL = window.API_URL;
		var userInput = document.getElementById("username");
		var passInput = document.getElementById("password");
		var msgBox = document.getElementById("msg");
		var loginBtn = document.getElementById("loginBtn");

		if (sessionStorage.getItem("token")) window.location.replace("dashboard.html");

		CsrfHelper.prime(API_URL);

		function showMsg(text, ok) {
			msgBox.textContent = text;
			msgBox.className = "auth-msg" + (ok ? " ok" : "");
		}

		async function doLogin() {
			var user = userInput.value.trim();
			var pass = passInput.value;
			showMsg("");
			if (!user || !pass) { showMsg("Kullanıcı adı ve şifreni gir."); return; }

			loginBtn.disabled = true;
			loginBtn.textContent = "Giriş yapılıyor…";
			try {
				var res = await fetch(API_URL + "/users/login", {
					method: "POST",
					credentials: "include",
					headers: { "Content-Type": "application/json", "X-CSRF-Token": CsrfHelper.getToken() },
					body: JSON.stringify({ username: user, password: pass })
				});
				if (!res.ok) { showMsg((await res.text()) || "Kullanıcı adı veya şifre hatalı."); return; }
				var data = await res.json();
				sessionStorage.setItem("token", data.token);
				sessionStorage.setItem("username", data.username);
				window.location.href = "dashboard.html";
			} catch (e) {
				showMsg("Sunucuya ulaşılamıyor.");
			} finally {
				loginBtn.disabled = false;
				loginBtn.textContent = "Giriş yap";
			}
		}

		loginBtn.addEventListener("click", doLogin);
		passInput.addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
	</script>
</body>

</html>
