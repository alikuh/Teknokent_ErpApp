<!DOCTYPE html>
<html lang="tr">

<head>
	<meta charset="UTF-8">
	<script src="theme.js"></script>
	<script src="csrf.js"></script>
	<link rel="stylesheet" href="theme.css">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Giriş | ERP</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, var(--color-bg-start) 0%, var(--color-bg-end) 100%);
			font-family: -apple-system, Segoe UI, Roboto, Tahoma, sans-serif;
		}

		.card {
			background: var(--color-surface);
			width: 340px;
			padding: 38px 34px 30px;
			border-radius: 14px;
			box-shadow: var(--shadow-card-lg);
		}

		.badge {
			width: 46px;
			height: 46px;
			margin: 0 auto 16px;
			border-radius: 12px;
			background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
			color: #fff;
			display: flex;
			align-items: center;
			justify-content: center;
			font-weight: 700;
			font-size: 15px;
			letter-spacing: 0.5px;
		}

		.card h1 {
			font-size: 19px;
			margin: 0 0 4px;
			text-align: center;
			color: var(--color-text);
		}

		.subtitle {
			text-align: center;
			font-size: 13px;
			color: var(--color-text-muted);
			margin: 0 0 24px;
		}

		label {
			display: block;
			font-size: 12px;
			font-weight: 600;
			color: var(--color-text-secondary);
			margin-bottom: 5px;
		}

		.field {
			margin-bottom: 15px;
		}

		.input-wrap {
			position: relative;
		}

		.input-wrap svg {
			position: absolute;
			left: 11px;
			top: 50%;
			transform: translateY(-50%);
			width: 15px;
			height: 15px;
			color: var(--color-text-faint);
		}

		input {
			width: 100%;
			padding: 10px 12px 10px 34px;
			border: 1.5px solid var(--color-border);
			border-radius: 8px;
			font-size: 14px;
			background: var(--color-input-bg);
			color: var(--color-text);
			transition: border-color .15s ease, background .15s ease;
		}

		input:focus {
			outline: none;
			border-color: var(--color-accent);
			background: var(--color-input-bg-focus);
		}

		.submit-btn {
			width: 100%;
			padding: 11px;
			margin-top: 8px;
			border: none;
			border-radius: 8px;
			background: var(--color-accent);
			color: #fff;
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
			transition: background .15s ease, transform .1s ease;
		}

		.submit-btn:hover {
			background: var(--color-accent-hover);
		}

		.submit-btn:active {
			transform: translateY(1px);
		}

		.submit-btn:disabled {
			background: var(--color-disabled-bg);
			cursor: default;
			transform: none;
		}

		.msg {
			min-height: 16px;
			text-align: center;
			font-size: 13px;
			margin-top: 12px;
		}

		.msg.err {
			color: var(--color-danger);
		}

		.switch {
			text-align: center;
			font-size: 13px;
			margin-top: 20px;
			padding-top: 18px;
			border-top: 1px solid var(--color-border-light);
			color: var(--color-text-muted);
		}

		.switch a {
			color: var(--color-accent);
			text-decoration: none;
			font-weight: 600;
		}

		.switch a:hover {
			text-decoration: underline;
		}
	</style>
</head>

<body>

	<div class="card">
		<div class="badge">ERP</div>
		<h1>Hesabına giriş yap</h1>
		<p class="subtitle">Devam etmek için bilgilerini gir</p>

		<div class="field">
			<label for="username">Kullanıcı adı</label>
			<div class="input-wrap">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
					<circle cx="12" cy="8" r="4" />
					<path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
				</svg>
				<input id="username" type="text" autocomplete="username">
			</div>
		</div>

		<div class="field">
			<label for="password">Şifre</label>
			<div class="input-wrap">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
					<rect x="5" y="11" width="14" height="9" rx="2" />
					<path d="M8 11V7a4 4 0 0 1 8 0v4" />
				</svg>
				<input id="password" type="password" autocomplete="current-password">
			</div>
		</div>

		<button id="loginBtn" class="submit-btn">Giriş yap</button>
		<div id="msg" class="msg"></div>

		<div class="switch">
			Hesabın yok mu? <a href="register.html">Kayıt ol</a>
		</div>
	</div>

	<script>
		var API_URL = "http://localhost:5077/api";

		var userInput = document.getElementById("username");
		var passInput = document.getElementById("password");
		var msgBox = document.getElementById("msg");
		var loginBtn = document.getElementById("loginBtn");

		// Sayfa acilir acilmaz csrf_token cerezini olustursun diye - asagidaki
		// login istegi ilk API cagrisi oldugu icin, o an cerez henuz olmayabilir.
		CsrfHelper.prime(API_URL);

		function showMsg(text) {
			msgBox.textContent = text;
			msgBox.className = text ? "msg err" : "msg";
		}

		async function doLogin() {
			var user = userInput.value.trim();
			var pass = passInput.value;

			showMsg("");

			if (!user || !pass) {
				showMsg("Kullanıcı adı ve şifreni gir.");
				return;
			}

			loginBtn.disabled = true;
			loginBtn.textContent = "Giriş yapılıyor...";

			try {
				var res = await fetch(API_URL + "/users/login", {
					method: "POST",
					credentials: "include",
					headers: {
						"Content-Type": "application/json",
						"X-CSRF-Token": CsrfHelper.getToken()
					},
					body: JSON.stringify({ username: user, password: pass })
				});

				if (!res.ok) {
					var errTxt = await res.text();
					showMsg(errTxt || "Kullanıcı adı veya şifre hatalı.");
					return;
				}

				var data = await res.json();
				sessionStorage.setItem("token", data.token);
				sessionStorage.setItem("username", data.username);
				window.location.href = "products.html";
			} catch (e) {
				showMsg("Sunucuya ulaşılamıyor.");
			} finally {
				loginBtn.disabled = false;
				loginBtn.textContent = "Giriş yap";
			}
		}

		loginBtn.addEventListener("click", doLogin);

		passInput.addEventListener("keydown", function (e) {
			if (e.key === "Enter") doLogin();
		});
	</script>

</body>

</html>
