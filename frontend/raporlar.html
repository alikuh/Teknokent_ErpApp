<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veresiye · Raporlar</title>
    <link rel="stylesheet" href="industry.css">
    <link rel="stylesheet" href="app.css">
    <script src="config.js"></script>
    <script src="csrf.js"></script>
    <script src="app-shell.js"></script>
</head>

<body>
    <div class="layout">
        <aside id="app-nav"></aside>
        <main class="main">
            <header>
                <h1>Raporlar</h1>
                <p class="muted">Son 6 ay</p>
            </header>

            <div class="grid-2">
                <section class="section">
                    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
                        <h3>Aylık satış ve tahsilat</h3>
                        <div style="display:flex;gap:12px;font-size:12px;font-family:var(--font-heading);letter-spacing:.06em;text-transform:uppercase">
                            <span style="display:flex;align-items:center;gap:5px"><i style="width:10px;height:10px;background:var(--c-steel)"></i>Satış</span>
                            <span style="display:flex;align-items:center;gap:5px"><i style="width:10px;height:10px;background:var(--c-paid)"></i>Tahsilat</span>
                        </div>
                    </div>
                    <div id="monthly"></div>
                </section>

                <section class="section debt">
                    <h3>Alacak yaşlandırma</h3>
                    <div id="aging"></div>
                    <p class="muted" style="font-size:13px;margin:10px 0 0">Tahsilatlar en eski fişten başlayarak kapatılır.</p>
                </section>

                <section class="section ink">
                    <h3>En çok satan ürünler</h3>
                    <div id="top-products"></div>
                </section>

                <section class="section paid">
                    <h3>Köylere göre alacak</h3>
                    <div id="by-village"></div>
                </section>
            </div>
        </main>
    </div>

    <div class="overlay" id="session-expired-overlay">
        <div class="modal" style="width:360px;text-align:center">
            <h3>Oturum süresi doldu</h3>
            <p class="muted">Güvenliğin için oturumun sona erdi. Devam etmek için tekrar giriş yap.</p>
            <div class="modal-actions" style="justify-content:center">
                <button class="btn primary" onclick="Shell.logout()">Tamam</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var S = window.Shell;
            var MONTHS = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];

            async function init() {
                try {
                    renderMonthly(await S.apiJson("/reports/monthly?months=6"));
                    renderAging(await S.apiJson("/reports/aging"));
                    renderTopProducts(await S.apiJson("/reports/top-products?count=8"));
                    renderVillages(await S.apiJson("/reports/by-village"));
                } catch (e) {
                    document.querySelector(".main header p").textContent = "Rapor yüklenemedi: " + e.message;
                }
            }

            function monthLabel(key) {
                var p = key.split("-");
                return MONTHS[+p[1] - 1] + " " + p[0].slice(2);
            }

            function renderMonthly(rows) {
                var max = Math.max(1, Math.max.apply(null, rows.map(function (m) { return Math.max(m.sales, m.collected); })));
                document.getElementById("monthly").innerHTML = rows.map(function (m) {
                    return '<div style="padding:8px 0;border-top:1px solid var(--color-divider)">' +
                        '<div style="display:flex;justify-content:space-between;font-size:13px" class="muted">' +
                        '<span style="font-family:var(--font-heading);font-size:15px;text-transform:uppercase;color:var(--color-text)">' + monthLabel(m.month) + '</span>' +
                        '<span>Satış ' + S.money(m.sales) + ' · Tahsilat ' + S.money(m.collected) + '</span></div>' +
                        '<div class="bar-track"><div class="bar-fill" style="width:' + pct(m.sales, max) + '%"></div></div>' +
                        '<div class="bar-track" style="margin-top:3px"><div class="bar-fill paid" style="width:' + pct(m.collected, max) + '%"></div></div>' +
                        '</div>';
                }).join("");
            }

            function renderAging(rows) {
                var label = { "0-30": "0-30 gün", "31-60": "31-60 gün", "61-90": "61-90 gün", "90+": "90+ gün" };
                var hue = { "0-30": "paid", "31-60": "warn", "61-90": "debt", "90+": "debt" };
                document.getElementById("aging").innerHTML = rows.map(function (a) {
                    return '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 12px;margin-bottom:6px;background:var(--c-' + hue[a.band] + '-tint);border-left:5px solid var(--c-' + hue[a.band] + ')">' +
                        '<span style="font-family:var(--font-heading);font-size:16px;color:var(--c-' + hue[a.band] + '-deep)">' + label[a.band] + '</span>' +
                        '<span class="muted" style="font-size:13px">' + a.count + ' fiş</span>' +
                        '<span style="font-family:var(--font-heading);font-size:22px;color:var(--c-' + hue[a.band] + '-deep);white-space:nowrap">' + S.money(a.amount) + '</span></div>';
                }).join("");
            }

            function renderTopProducts(rows) {
                if (!rows.length) { document.getElementById("top-products").innerHTML = '<p class="muted">Veri yok.</p>'; return; }
                document.getElementById("top-products").innerHTML = rows.map(function (p) {
                    return '<div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--color-divider)">' +
                        '<span>' + S.esc(p.name) + '</span>' +
                        '<span class="muted" style="font-size:13px;white-space:nowrap">' + S.qty(p.qty) + '</span>' +
                        '<span style="font-family:var(--font-heading);font-size:18px;white-space:nowrap">' + S.money(p.total) + '</span></div>';
                }).join("");
            }

            function renderVillages(rows) {
                if (!rows.length) { document.getElementById("by-village").innerHTML = '<p class="muted">Açık alacak yok.</p>'; return; }
                var max = Math.max(1, Math.max.apply(null, rows.map(function (v) { return v.amount; })));
                document.getElementById("by-village").innerHTML = rows.map(function (v) {
                    return '<div style="padding:8px 0;border-top:1px solid var(--color-divider)">' +
                        '<div style="display:flex;justify-content:space-between;gap:10px">' +
                        '<span>' + S.esc(v.village) + '</span>' +
                        '<span style="font-family:var(--font-heading);font-size:17px;color:var(--c-debt-deep);white-space:nowrap">' + S.money(v.amount) + '</span></div>' +
                        '<div class="bar-track" style="height:7px"><div class="bar-fill debt" style="width:' + pct(v.amount, max) + '%"></div></div></div>';
                }).join("");
            }

            function pct(v, max) { return Math.round((v / max) * 100); }

            init();
        })();
    </script>
</body>

</html>
