<!DOCTYPE html>
<html lang="tr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kayıt · Veresiye Defteri</title>
	<link rel="stylesheet" href="industry.css">
	<link rel="stylesheet" href="app.css">
	<script src="csrf.js"></script>
	<script src="config.js"></script>
	<style>
		body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
		.auth-card {
			position: relative; width: 360px;
			border: 1px solid var(--color-divider); background: var(--color-surface);
			padding: 36px 32px 28px;
		}
		.auth-kicker {
			font-family: var(--font-heading); font-size: 12px;
			letter-spacing: .14em; text-transform: uppercase; color: var(--color-accent-700);
		}
		.auth-card h1 { font-size: 27px; margin: 2px 0 4px; }
		.auth-card .lead { color: var(--color-neutral-700); margin: 0 0 22px; font-size: 14px; }
		.auth-card .field { margin-bottom: 14px; }
		.auth-card .hint { font-size: 11px; color: var(--color-neutral-600); margin-top: 4px; }
		.auth-card .btn { width: 100%; justify-content: center; margin-top: 6px; }
		.auth-msg { min-height: 18px; font-size: 13px; margin-top: 12px; color: var(--c-debt-deep); }
		.auth-msg.ok { color: var(--c-paid-deep); }
		.auth-switch {
			margin-top: 20px; padding-top: 16px; font-size: 13px;
			border-top: 1px solid var(--color-divider); color: var(--color-neutral-700);
		}
	</style>
</head>

<body>
	<div class="auth-card">
		<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
		<div class="auth-kicker">Veresiye Defteri</div>
		<h1>Yeni hesap</h1>
		<p class="lead">Dükkânın için bir hesap oluştur.</p>

		<div class="field">
			<label for="username">Kullanıcı adı</label>
			<input id="username" type="text" autocomplete="username">
		</div>
		<div class="field">
			<label for="password">Şifre</label>
			<input id="password" type="password" autocomplete="new-password">
			<div class="hint">En az 6 karakter</div>
		</div>
		<div class="field">
			<label for="confirm">Şifre (tekrar)</label>
			<input id="confirm" type="password" autocomplete="new-password">
		</div>

		<button id="registerBtn" class="btn primary">Kayıt ol</button>
		<div id="msg" class="auth-msg"></div>

		<div class="auth-switch">Zaten hesabın var mı? <a href="login.html">Giriş yap</a></div>
	</div>

	<script>
		var API_URL = window.API_URL;
		var userInput = document.getElementById("username");
		var passInput = document.getElementById("password");
		var confirmInput = document.getElementById("confirm");
		var msgBox = document.getElementById("msg");
		var registerBtn = document.getElementById("registerBtn");

		CsrfHelper.prime(API_URL);

		function showMsg(text, ok) {
			msgBox.textContent = text;
			msgBox.className = "auth-msg" + (ok ? " ok" : "");
		}

		async function doRegister() {
			var user = userInput.value.trim();
			var pass = passInput.value;
			var confirm = confirmInput.value;
			showMsg("");
			if (!user || !pass) { showMsg("Kullanıcı adı ve şifre boş olamaz."); return; }
			if (pass.length < 6) { showMsg("Şifre en az 6 karakter olmalı."); return; }
			if (pass !== confirm) { showMsg("Şifreler eşleşmiyor."); return; }

			registerBtn.disabled = true;
			registerBtn.textContent = "Kaydediliyor…";
			try {
				var res = await fetch(API_URL + "/users/register", {
					method: "POST",
					credentials: "include",
					headers: { "Content-Type": "application/json", "X-CSRF-Token": CsrfHelper.getToken() },
					body: JSON.stringify({ username: user, password: pass })
				});
				if (!res.ok) { showMsg((await res.text()) || "Kayıt sırasında bir hata oluştu."); return; }
				showMsg("Kayıt tamam, giriş sayfasına yönlendiriliyorsun…", true);
				setTimeout(function () { window.location.href = "login.html"; }, 1400);
			} catch (e) {
				showMsg("Sunucuya ulaşılamıyor.");
			} finally {
				registerBtn.disabled = false;
				registerBtn.textContent = "Kayıt ol";
			}
		}

		registerBtn.addEventListener("click", doRegister);
		confirmInput.addEventListener("keydown", function (e) { if (e.key === "Enter") doRegister(); });
	</script>
</body>

</html>
