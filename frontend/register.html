<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayıt Ol | ERP</title>
<style>
	* { box-sizing: border-box; }

	body {
		margin: 0;
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		background: linear-gradient(135deg, var(--color-bg-start) 0%, var(--color-bg-end) 100%);
		font-family: -apple-system, Segoe UI, Roboto, Tahoma, sans-serif;
	}

	.card {
		background: var(--color-surface);
		width: 340px;
		padding: 38px 34px 30px;
		border-radius: 14px;
		box-shadow: var(--shadow-card-lg);
	}

	.badge {
		width: 46px;
		height: 46px;
		margin: 0 auto 16px;
		border-radius: 12px;
		background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
		color: #fff;
		display: flex;
		align-items: center;
		justify-content: center;
		font-weight: 700;
		font-size: 15px;
		letter-spacing: 0.5px;
	}

	.card h1 {
		font-size: 19px;
		margin: 0 0 4px;
		text-align: center;
		color: var(--color-text);
	}

	.subtitle {
		text-align: center;
		font-size: 13px;
		color: var(--color-text-muted);
		margin: 0 0 24px;
	}

	label {
		display: block;
		font-size: 12px;
		font-weight: 600;
		color: var(--color-text-secondary);
		margin-bottom: 5px;
	}

	.field {
		margin-bottom: 15px;
	}

	.input-wrap {
		position: relative;
	}

	.input-wrap svg {
		position: absolute;
		left: 11px;
		top: 50%;
		transform: translateY(-50%);
		width: 15px;
		height: 15px;
		color: var(--color-text-faint);
	}

	input {
		width: 100%;
		padding: 10px 12px 10px 34px;
		border: 1.5px solid var(--color-border);
		border-radius: 8px;
		font-size: 14px;
		background: var(--color-input-bg);
		color: var(--color-text);
		transition: border-color .15s ease, background .15s ease;
	}

	input:focus {
		outline: none;
		border-color: var(--color-accent);
		background: var(--color-input-bg-focus);
	}

	.hint {
		font-size: 11px;
		color: var(--color-text-faint);
		margin-top: 4px;
	}

	.submit-btn {
		width: 100%;
		padding: 11px;
		margin-top: 8px;
		border: none;
		border-radius: 8px;
		background: var(--color-accent);
		color: #fff;
		font-size: 14px;
		font-weight: 600;
		cursor: pointer;
		transition: background .15s ease, transform .1s ease;
	}

	.submit-btn:hover {
		background: var(--color-accent-hover);
	}

	.submit-btn:active {
		transform: translateY(1px);
	}

	.submit-btn:disabled {
		background: var(--color-disabled-bg);
		cursor: default;
		transform: none;
	}

	.msg {
		min-height: 16px;
		text-align: center;
		font-size: 13px;
		margin-top: 12px;
	}

	.msg.err { color: var(--color-danger); }
	.msg.ok { color: var(--color-success); }

	.switch {
		text-align: center;
		font-size: 13px;
		margin-top: 20px;
		padding-top: 18px;
		border-top: 1px solid var(--color-border-light);
		color: var(--color-text-muted);
	}

	.switch a {
		color: var(--color-accent);
		text-decoration: none;
		font-weight: 600;
	}

	.switch a:hover {
		text-decoration: underline;
	}
</style>
</head>
<body>

	<div class="card">
		<div class="badge">ERP</div>
		<h1>Yeni hesap oluştur</h1>
		<p class="subtitle">Birkaç adımda hazırsın</p>

		<div class="field">
			<label for="username">Kullanıcı adı</label>
			<div class="input-wrap">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
				<input id="username" type="text" autocomplete="username">
			</div>
		</div>

		<div class="field">
			<label for="password">Şifre</label>
			<div class="input-wrap">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
				<input id="password" type="password" autocomplete="new-password">
			</div>
			<div class="hint">En az 6 karakter</div>
		</div>

		<div class="field">
			<label for="confirm">Şifre (tekrar)</label>
			<div class="input-wrap">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
				<input id="confirm" type="password" autocomplete="new-password">
			</div>
		</div>

		<button id="registerBtn" class="submit-btn">Kayıt ol</button>
		<div id="msg" class="msg"></div>

		<div class="switch">
			Zaten hesabın var mı? <a href="login.html">Giriş yap</a>
		</div>
	</div>

	<script>
		var API_URL = "http://localhost:5077/api";

		var userInput = document.getElementById("username");
		var passInput = document.getElementById("password");
		var confirmInput = document.getElementById("confirm");
		var msgBox = document.getElementById("msg");
		var registerBtn = document.getElementById("registerBtn");

		function showMsg(text, ok) {
			msgBox.textContent = text;
			msgBox.className = text ? ("msg " + (ok ? "ok" : "err")) : "msg";
		}

		async function doRegister() {
			var user = userInput.value.trim();
			var pass = passInput.value;
			var confirm = confirmInput.value;

			showMsg("");

			if (!user || !pass) {
				showMsg("Kullanıcı adı ve şifre boş olamaz.");
				return;
			}
			if (pass.length < 6) {
				showMsg("Şifre en az 6 karakter olmalı.");
				return;
			}
			if (pass !== confirm) {
				showMsg("Şifreler eşleşmiyor.");
				return;
			}

			registerBtn.disabled = true;
			registerBtn.textContent = "Kaydediliyor...";

			try {
				var res = await fetch(API_URL + "/users/register", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ username: user, password: pass })
				});

				if (!res.ok) {
					var errTxt = await res.text();
					showMsg(errTxt || "Kayıt sırasında bir hata oluştu.");
					return;
				}

				showMsg("Kayıt tamam, giriş sayfasına yönlendiriliyorsun...", true);
				setTimeout(function () {
					window.location.href = "login.html";
				}, 1400);
			} catch (e) {
				showMsg("Sunucuya ulaşılamıyor.");
			} finally {
				registerBtn.disabled = false;
				registerBtn.textContent = "Kayıt ol";
			}
		}

		registerBtn.addEventListener("click", doRegister);

		confirmInput.addEventListener("keydown", function (e) {
			if (e.key === "Enter") doRegister();
		});
	</script>

</body>
</html>
