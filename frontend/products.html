<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>ERP - Ürünler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .topbar a {
            margin-left: 15px;
            color: #2c7be5;
            text-decoration: none;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .form-row input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
            min-width: 120px;
        }

        .form-row button {
            padding: 8px 20px;
            background: #2c7be5;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #fafafa;
        }

        .low-stock {
            color: #e63946;
            font-weight: bold;
        }

        .actions button {
            margin-right: 5px;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-delete {
            background: #e63946;
            color: white;
        }

        .btn-sell {
            background: #2ecc71;
            color: white;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div>Hoş geldin, <strong id="usernameDisplay"></strong></div>
        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="products.html">Ürünler</a>
            <a href="#" onclick="logout()">Çıkış Yap</a>
        </div>
    </div>

    <div class="container">
        <h2 id="formTitle">Yeni Ürün Ekle</h2>
        <div class="form-row">
            <input type="text" id="name" placeholder="Ürün adı">
            <input type="text" id="description" placeholder="Açıklama (opsiyonel)">
            <input type="number" id="price" placeholder="Fiyat" step="0.01">
            <input type="number" id="stockQuantity" placeholder="Stok adedi">
            <button id="submitButton" onclick="addProduct()">Ekle</button>
            <button id="cancelButton" onclick="cancelEdit()" style="display:none; background:#888;">İptal</button>
        </div>

        <h2>Ürün Listesi</h2>
        <table>
            <thead>
                <tr>
                    <th>Ad</th>
                    <th>Açıklama</th>
                    <th>Fiyat</th>
                    <th>Stok</th>
                    <th>İşlemler</th>
                </tr>
            </thead>
            <tbody id="productTableBody"></tbody>
        </table>
    </div>

    <script>
        const API_URL = "http://localhost:5077/api";
        const token = sessionStorage.getItem("token");
        const username = sessionStorage.getItem("username");

        if (!token) {
            window.location.href = "login.html";
        }

        document.getElementById("usernameDisplay").textContent = username;

        function logout() {
            sessionStorage.clear();
            window.location.href = "login.html";
        }

        async function loadProducts() {
            const response = await fetch(`${API_URL}/products`, {
                headers: { "Authorization": token }
            });
            const products = await response.json();

            const tbody = document.getElementById("productTableBody");
            tbody.innerHTML = "";

            products.forEach(p => {
                const row = document.createElement("tr");
                const stockClass = p.stockQuantity < 10 ? "low-stock" : "";

                row.innerHTML = `
                    <td>${p.name}</td>
                    <td>${p.description ?? ""}</td>
                    <td>${p.price.toFixed(2)} TL</td>
                    <td class="${stockClass}">${p.stockQuantity}</td>
                    <td class="actions">
                        <button class="btn-sell" onclick="sellProduct(${p.id})">Sat</button>
                        <button class="btn-edit" onclick='startEdit(${JSON.stringify(p)})'>Düzenle</button>
                        <button class="btn-delete" onclick="deleteProduct(${p.id})">Sil</button>
                    </td>
                    `;
                tbody.appendChild(row);
            });
        }
        let editingProductId = null;

        function startEdit(product) {
            editingProductId = product.id;

            document.getElementById("name").value = product.name;
            document.getElementById("description").value = product.description ?? "";
            document.getElementById("price").value = product.price;
            document.getElementById("stockQuantity").value = product.stockQuantity;

            document.getElementById("formTitle").textContent = "Ürünü Düzenle";
            document.getElementById("submitButton").textContent = "Güncelle";
            document.getElementById("submitButton").setAttribute("onclick", "updateProduct()");
            document.getElementById("cancelButton").style.display = "inline-block";

            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function cancelEdit() {
            editingProductId = null;

            document.getElementById("name").value = "";
            document.getElementById("description").value = "";
            document.getElementById("price").value = "";
            document.getElementById("stockQuantity").value = "";

            document.getElementById("formTitle").textContent = "Yeni Ürün Ekle";
            document.getElementById("submitButton").textContent = "Ekle";
            document.getElementById("submitButton").setAttribute("onclick", "addProduct()");
            document.getElementById("cancelButton").style.display = "none";
        }

        async function updateProduct() {
            const name = document.getElementById("name").value;
            const description = document.getElementById("description").value;
            const price = parseFloat(document.getElementById("price").value);
            const stockQuantity = parseInt(document.getElementById("stockQuantity").value);

            if (!name || isNaN(price) || isNaN(stockQuantity)) {
                alert("Lütfen ürün adı, fiyat ve stok adedini doğru gir.");
                return;
            }

            const response = await fetch(`${API_URL}/products/${editingProductId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "Authorization": token },
                body: JSON.stringify({ id: editingProductId, name, description, price, stockQuantity })
            });

            if (!response.ok) {
                alert("Güncelleme sırasında bir hata oluştu.");
                return;
            }

            cancelEdit();
            loadProducts();
        }
        async function addProduct() {
            const name = document.getElementById("name").value;
            const description = document.getElementById("description").value;
            const price = parseFloat(document.getElementById("price").value);
            const stockQuantity = parseInt(document.getElementById("stockQuantity").value);

            if (!name || isNaN(price) || isNaN(stockQuantity)) {
                alert("Lütfen ürün adı, fiyat ve stok adedini doğru gir.");
                return;
            }

            await fetch(`${API_URL}/products`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": token },
                body: JSON.stringify({ name, description, price, stockQuantity })
            });

            document.getElementById("name").value = "";
            document.getElementById("description").value = "";
            document.getElementById("price").value = "";
            document.getElementById("stockQuantity").value = "";

            loadProducts();
        }

        async function deleteProduct(id) {
            if (!confirm("Bu ürünü silmek istediğine emin misin?")) return;
            await fetch(`${API_URL}/products/${id}`, {
                method: "DELETE",
                headers: { "Authorization": token }
            });
            loadProducts();
        }

        async function sellProduct(id) {
            const quantity = prompt("Kaç adet satıldı?");
            if (!quantity || isNaN(quantity)) return;

            const response = await fetch(`${API_URL}/sales`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": token },
                body: JSON.stringify({ productId: id, quantity: parseInt(quantity) })
            });

            if (!response.ok) {
                const errorText = await response.text();
                alert("Hata: " + errorText);
                return;
            }

            loadProducts();
        }

        loadProducts();
    </script>

</body>

</html>
