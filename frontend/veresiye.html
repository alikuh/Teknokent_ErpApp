<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veresiye · Defter</title>
    <link rel="stylesheet" href="industry.css">
    <link rel="stylesheet" href="app.css">
    <script src="config.js"></script>
    <script src="csrf.js"></script>
    <script src="app-shell.js"></script>
</head>

<body>
    <div class="layout">
        <aside id="app-nav"></aside>
        <main class="main">
            <header>
                <h1>Veresiye defteri</h1>
                <p id="subtitle" class="muted">Kapanmamış fişler — en eskisi üstte.</p>
            </header>

            <div style="display:flex;gap:12px;align-items:end;margin-bottom:16px;flex-wrap:wrap">
                <div class="field" style="max-width:340px;flex:1">
                    <label>Müşteri ara</label>
                    <input id="q" placeholder="İsim veya köy">
                </div>
                <div class="seg" id="age-filter">
                    <button data-band="all" class="active">Hepsi</button>
                    <button data-band="0-30">0-30 gün</button>
                    <button data-band="31-60">31-60 gün</button>
                    <button data-band="60+">60+ gün</button>
                </div>
            </div>

            <div class="table-wrap">
                <table class="data">
                    <thead>
                        <tr>
                            <th>Fiş no</th>
                            <th>Tarih</th>
                            <th>Müşteri</th>
                            <th>İçerik</th>
                            <th class="num">Yaş</th>
                            <th class="num">Fiş tutarı</th>
                            <th class="num">Kalan</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
            <p class="foot-note" id="foot"></p>
        </main>
    </div>

    <div class="overlay" id="session-expired-overlay">
        <div class="modal" style="width:360px;text-align:center">
            <h3>Oturum süresi doldu</h3>
            <p class="muted">Güvenliğin için oturumun sona erdi. Devam etmek için tekrar giriş yap.</p>
            <div class="modal-actions" style="justify-content:center">
                <button class="btn primary" onclick="Shell.logout()">Tamam</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var S = window.Shell;
            var band = "all", debounce;

            var q = document.getElementById("q");
            q.addEventListener("input", function () {
                clearTimeout(debounce);
                debounce = setTimeout(load, 250);
            });
            document.getElementById("age-filter").addEventListener("click", function (e) {
                var b = e.target.closest("button");
                if (!b) return;
                band = b.dataset.band;
                [].forEach.call(this.children, function (c) { c.classList.toggle("active", c === b); });
                load();
            });

            function ageHue(age) {
                return age <= 30 ? "paid" : age <= 60 ? "warn" : "debt";
            }

            async function load() {
                try {
                    var data = await S.apiJson("/receipts?q=" + encodeURIComponent(q.value.trim()) +
                        "&ageBand=" + encodeURIComponent(band));
                    document.getElementById("subtitle").textContent =
                        "Kapanmamış fişler — en eskisi üstte. Toplam açık: " + S.money(data.totalOpen);
                    renderRows(data.items);
                    document.getElementById("foot").textContent = data.count + " açık fiş listeleniyor.";
                } catch (e) {
                    document.getElementById("foot").textContent = "Yüklenemedi: " + e.message;
                }
            }

            function renderRows(items) {
                var body = document.getElementById("rows");
                if (!items.length) {
                    body.innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">Açık fiş yok.</td></tr>';
                    return;
                }
                body.innerHTML = items.map(function (r) {
                    return '<tr class="clickable" onclick="location.href=\'musteri.html?id=' + r.customerId + '\'">' +
                        '<td class="muted" style="font-family:var(--font-heading)">' + r.no + '</td>' +
                        '<td style="white-space:nowrap">' + S.dtext(r.date) + '</td>' +
                        '<td style="font-weight:500">' + S.esc(r.customerName) +
                        '<span class="muted" style="font-weight:400"> · ' + S.esc(r.village || "—") + '</span></td>' +
                        '<td class="muted" style="font-size:13px">' + S.esc(r.summary) + '</td>' +
                        '<td class="num"><span class="pill ' + ageHue(r.ageDays) + '">' + r.ageDays + ' gün</span></td>' +
                        '<td class="num muted">' + S.money(r.total) + '</td>' +
                        '<td class="amount debt">' + S.money(r.remaining) + '</td></tr>';
                }).join("");
            }

            load();
        })();
    </script>
</body>

</html>
