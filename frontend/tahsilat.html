<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veresiye · Tahsilat</title>
    <link rel="stylesheet" href="industry.css">
    <link rel="stylesheet" href="app.css">
    <script src="config.js"></script>
    <script src="csrf.js"></script>
    <script src="app-shell.js"></script>
</head>

<body>
    <div class="layout">
        <aside id="app-nav"></aside>
        <main class="main">
            <header>
                <h1>Tahsilat</h1>
                <p id="subtitle" class="muted">Yükleniyor…</p>
            </header>

            <div class="grid-main-aside" style="grid-template-columns:340px 1fr">
                <section style="border:1px solid var(--color-divider);padding:20px;display:flex;flex-direction:column;gap:14px">
                    <h3 style="margin:0;font-size:21px">Ödeme kaydet</h3>
                    <div class="field">
                        <label>Müşteri</label>
                        <select id="customer"></select>
                        <span class="muted" style="font-size:13px" id="balance"></span>
                    </div>
                    <div class="field">
                        <label>Tutar</label>
                        <input id="amount" type="number" min="0" step="10">
                        <button class="btn-link" id="fill-full" style="align-self:flex-start;margin-top:4px">Tüm bakiyeyi yaz</button>
                    </div>
                    <div class="field">
                        <label>Ödeme yolu</label>
                        <div class="seg" id="method">
                            <button data-m="Nakit" class="active">Nakit</button>
                            <button data-m="Havale">Havale</button>
                            <button data-m="Kart">Kart</button>
                        </div>
                    </div>
                    <div class="field">
                        <label>Not</label>
                        <input id="note" placeholder="Opsiyonel">
                    </div>
                    <button class="btn primary" id="save" style="padding:12px 18px;font-size:17px">Tahsilatı kaydet</button>
                    <div class="flash" id="flash"></div>
                </section>

                <section>
                    <h3 style="margin:0 0 10px;font-size:21px">Son tahsilatlar</h3>
                    <div class="table-wrap">
                        <table class="data">
                            <thead>
                                <tr>
                                    <th>Tarih</th>
                                    <th>Müşteri</th>
                                    <th>Yol</th>
                                    <th>Not</th>
                                    <th class="num">Tutar</th>
                                </tr>
                            </thead>
                            <tbody id="rows"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div class="overlay" id="session-expired-overlay">
        <div class="modal" style="width:360px;text-align:center">
            <h3>Oturum süresi doldu</h3>
            <p class="muted">Güvenliğin için oturumun sona erdi. Devam etmek için tekrar giriş yap.</p>
            <div class="modal-actions" style="justify-content:center">
                <button class="btn primary" onclick="Shell.logout()">Tamam</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var S = window.Shell;
            var customers = [], balances = {}, method = "Nakit";
            var preCustomer = new URLSearchParams(location.search).get("customer");

            var customerSel = document.getElementById("customer");
            customerSel.addEventListener("change", renderBalance);
            document.getElementById("fill-full").addEventListener("click", function () {
                document.getElementById("amount").value = Math.max(0, balances[customerSel.value] || 0);
            });
            document.getElementById("method").addEventListener("click", function (e) {
                var b = e.target.closest("button");
                if (!b) return;
                method = b.dataset.m;
                [].forEach.call(this.children, function (c) { c.classList.toggle("active", c === b); });
            });
            document.getElementById("save").addEventListener("click", save);

            async function init() {
                try {
                    var cdata = await S.apiJson("/customers?pageSize=200");
                    customers = cdata.items;
                    customers.forEach(function (c) { balances[c.id] = c.balance; });
                    // Borçlular üstte
                    customers.sort(function (a, b) { return b.balance - a.balance; });
                    customerSel.innerHTML = customers.map(function (c) {
                        return '<option value="' + c.id + '">' + S.esc(c.name) +
                            ' — ' + S.money(Math.max(0, c.balance)) + '</option>';
                    }).join("");
                    if (preCustomer) customerSel.value = preCustomer;
                    renderBalance();
                    await loadRecent();
                } catch (e) {
                    document.getElementById("subtitle").textContent = "Yüklenemedi: " + e.message;
                }
            }

            async function loadRecent() {
                var rows = await S.apiJson("/payments?limit=20");
                var monthPrefix = new Date().toISOString().slice(0, 7);
                var monthTotal = rows.filter(function (p) { return String(p.date).slice(0, 7) === monthPrefix; })
                    .reduce(function (a, p) { return a + p.amount; }, 0);
                document.getElementById("subtitle").textContent = "Bu ay listelenen tahsilat: " + S.money(monthTotal);
                var body = document.getElementById("rows");
                if (!rows.length) {
                    body.innerHTML = '<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">Tahsilat yok.</td></tr>';
                    return;
                }
                body.innerHTML = rows.map(function (p) {
                    return '<tr class="clickable" onclick="location.href=\'musteri.html?id=' + p.customerId + '\'">' +
                        '<td style="white-space:nowrap">' + S.dtext(p.date) + '</td>' +
                        '<td style="font-weight:500">' + S.esc(p.customerName) + '</td>' +
                        '<td class="muted">' + S.esc(p.method) + '</td>' +
                        '<td class="muted" style="font-size:13px">' + S.esc(p.note || "—") + '</td>' +
                        '<td class="amount paid">' + S.money(p.amount) + '</td></tr>';
                }).join("");
            }

            function renderBalance() {
                var bal = Math.max(0, balances[customerSel.value] || 0);
                document.getElementById("balance").textContent = "Bakiye: " + S.money(bal);
            }

            async function save() {
                var flash = document.getElementById("flash");
                flash.className = "flash";
                var amount = parseFloat(document.getElementById("amount").value);
                if (!amount || amount <= 0) { flash.className = "flash error"; flash.textContent = "Geçerli bir tutar gir."; return; }
                if (!customerSel.value) { flash.className = "flash error"; flash.textContent = "Müşteri seç."; return; }
                try {
                    await S.apiJson("/payments", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            customerId: +customerSel.value,
                            amount: amount,
                            method: method,
                            note: document.getElementById("note").value.trim()
                        })
                    });
                    var name = (customers.find(function (c) { return String(c.id) === customerSel.value; }) || {}).name || "";
                    flash.textContent = name + " — " + S.money(amount) + " tahsilat kaydedildi.";
                    document.getElementById("amount").value = "";
                    document.getElementById("note").value = "";
                    // bakiyeleri tazele
                    var cdata = await S.apiJson("/customers?pageSize=200");
                    cdata.items.forEach(function (c) { balances[c.id] = c.balance; });
                    renderBalance();
                    await loadRecent();
                    S.refreshShellStats();
                } catch (e) {
                    flash.className = "flash error";
                    flash.textContent = e.message || "Tahsilat kaydedilemedi.";
                }
            }

            init();
        })();
    </script>
</body>

</html>
