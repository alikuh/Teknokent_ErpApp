<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veresiye · Panel</title>
    <link rel="stylesheet" href="industry.css">
    <link rel="stylesheet" href="app.css">
    <script src="config.js"></script>
    <script src="csrf.js"></script>
    <script src="app-shell.js"></script>
</head>

<body>
    <div class="layout">
        <aside id="app-nav"></aside>
        <main class="main">
            <header>
                <h1>Panel</h1>
                <p id="subtitle">Yükleniyor…</p>
            </header>

            <div class="kpi-grid" id="kpis"></div>

            <div class="grid-2">
                <section class="section debt">
                    <div style="display:flex;justify-content:space-between;align-items:baseline">
                        <h3>En yüksek borçlular</h3>
                        <a class="btn-link" href="veresiye.html">Defteri aç →</a>
                    </div>
                    <div class="table-wrap">
                        <table class="data">
                            <tbody id="top-debtors"></tbody>
                        </table>
                    </div>
                </section>

                <section class="section">
                    <h3>Son hareketler</h3>
                    <div class="table-wrap">
                        <table class="data">
                            <tbody id="recent-moves"></tbody>
                        </table>
                    </div>
                </section>
            </div>

            <section class="section warn">
                <h3>Kritik stok</h3>
                <div id="low-stock" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px">
                </div>
            </section>
        </main>
    </div>

    <div class="overlay" id="session-expired-overlay">
        <div class="modal" style="width:360px;text-align:center">
            <h3>Oturum süresi doldu</h3>
            <p class="muted">Güvenliğin için oturumun sona erdi. Devam etmek için tekrar giriş yap.</p>
            <div class="modal-actions" style="justify-content:center">
                <button class="btn primary" onclick="Shell.logout()">Tamam</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var S = window.Shell;

            var KIND = {
                veresiye: ["debt", "Veresiye fiş"],
                nakit: ["paid", "Nakit satış"],
                kart: ["ink", "Kart satış"],
                tahsilat: ["paid", "Tahsilat"]
            };

            async function init() {
                try {
                    var summary = await S.apiJson("/dashboard/summary");
                    renderKpis(summary);
                    document.getElementById("subtitle").textContent =
                        new Date().toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" }) +
                        " · " + summary.debtorCount + " borçlu müşteri";

                    var debtors = await S.apiJson("/dashboard/top-debtors?count=8");
                    renderDebtors(debtors);

                    var moves = await S.apiJson("/dashboard/recent-movements?count=8");
                    renderMoves(moves);

                    var low = await S.apiJson("/dashboard/low-stock");
                    renderLowStock(low);
                } catch (e) {
                    document.getElementById("subtitle").textContent = "Panel yüklenemedi: " + e.message;
                }
            }

            function renderKpis(s) {
                document.getElementById("kpis").innerHTML = [
                    kpi("debt", "Açık veresiye", S.money(s.openReceivables), s.debtorCount + " müşteride"),
                    kpi("", "Bugünkü satış", S.money(s.todaySales), s.todayReceiptCount + " fiş"),
                    kpi("paid", "Bu ay tahsilat", S.money(s.monthCollected), s.monthPaymentCount + " ödeme"),
                    kpi("warn", "Kritik stok", String(s.criticalStockCount), "eşik altı ürün")
                ].join("");
            }

            function kpi(cls, label, value, sub) {
                return '<div class="kpi ' + cls + '">' +
                    '<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>' +
                    '<div class="label">' + label + '</div>' +
                    '<div class="value">' + value + '</div>' +
                    '<div class="sub">' + sub + '</div></div>';
            }

            function renderDebtors(rows) {
                var body = document.getElementById("top-debtors");
                if (!rows.length) { body.innerHTML = emptyRow(4, "Borçlu müşteri yok."); return; }
                body.innerHTML = rows.map(function (c) {
                    return '<tr class="clickable" onclick="location.href=\'musteri.html?id=' + c.customerId + '\'">' +
                        '<td style="font-weight:500">' + S.esc(c.name) + '</td>' +
                        '<td class="muted">' + S.esc(c.village || "—") + '</td>' +
                        '<td class="muted">' + S.dtext(c.lastMovement) + '</td>' +
                        '<td class="amount debt">' + S.money(c.balance) + '</td></tr>';
                }).join("");
            }

            function renderMoves(rows) {
                var body = document.getElementById("recent-moves");
                if (!rows.length) { body.innerHTML = emptyRow(4, "Henüz hareket yok."); return; }
                body.innerHTML = rows.map(function (m) {
                    var k = KIND[m.kind] || KIND.tahsilat;
                    return '<tr>' +
                        '<td class="muted" style="white-space:nowrap">' + S.dtext(m.date) + '</td>' +
                        '<td>' + S.esc(m.name) + '</td>' +
                        '<td><span class="pill ' + k[0] + '">' + k[1] + '</span></td>' +
                        '<td class="amount ' + k[0] + '">' + S.money(m.amount) + '</td></tr>';
                }).join("");
            }

            function renderLowStock(rows) {
                var box = document.getElementById("low-stock");
                if (!rows.length) { box.innerHTML = '<p class="muted" style="margin:0">Kritik stokta ürün yok.</p>'; return; }
                box.innerHTML = rows.map(function (p) {
                    return '<div class="pill warn" style="display:block;padding:10px 12px;text-transform:none;letter-spacing:0">' +
                        '<div style="font-weight:600;font-size:14px">' + S.esc(p.name) + '</div>' +
                        '<div style="font-size:13px">Kalan ' + S.qty(p.stock) + ' ' + S.esc(p.unit) +
                        ' · eşik ' + S.qty(p.threshold) + '</div></div>';
                }).join("");
            }

            function emptyRow(cols, text) {
                return '<tr><td colspan="' + cols + '" class="muted" style="text-align:center;padding:24px">' + text + '</td></tr>';
            }

            init();
        })();
    </script>
</body>

</html>
